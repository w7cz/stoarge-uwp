# Put at .github/workflows/zip.yaml. Commit XboxStorageAnalyzer.zip to the repo root -> it is unzipped into ./XboxStorageAnalyzer and the zip is removed.
name: Unzip project
on:
  push:
    paths: ['XboxStorageAnalyzer.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          test -f XboxStorageAnalyzer.zip
          unzip -o XboxStorageAnalyzer.zip -d .
          rm XboxStorageAnalyzer.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip XboxStorageAnalyzer project" || echo "Nothing to commit"
          git push
